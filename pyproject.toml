[project]
name = "gon-stock"
version = "0.1.0"
description = "한국투자증권 국내·미국 주식 연구와 모의 검증"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<1",
]

[project.scripts]
gon-stock = "gon_stock.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gon_stock"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"
